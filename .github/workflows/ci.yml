name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint
      - run: composer test

  standards:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Run coding standards
        run: |
          set +e
          vendor/bin/phpcs
          status=$?
          vendor/bin/phpcs --report=json > phpcs-report.json || true
          vendor/bin/phpcbf || true
          git diff --no-ext-diff > phpcbf.patch
          exit "$status"
      - name: Upload coding standards diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coding-standards-diagnostics
          path: |
            phpcs-report.json
            phpcbf.patch
          if-no-files-found: error
          retention-days: 7
      - name: Run static analysis
        if: always()
        run: composer analyse
